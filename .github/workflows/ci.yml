name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.25]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Run vet
      run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v4
      with:
        go-version: 1.25
    # `@latest` は module path に /v2 が無いので v1 に解決される (実測: v1.64.8)。
    # .golangci.yml は v2 形式なので v1 では起動できない。手元と同じ版を明示する。
    - name: Install golangci-lint from source
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
    - name: Run golangci-lint
      run: golangci-lint run